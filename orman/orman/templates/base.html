<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>
<body>
  <div class="navbar-start">
    <div class="dropdown is-hoverable">
      <div class="dropdown-trigger">
        <button class="button" aria-haspopup="true" aria-controls="dropdown-menu">
          <span class="icon is-small">
            <i class="fas fa-bars" aria-hidden="true"></i>
          </span>
        </button>
      </div>
      <div class="dropdown-menu" id="dropdown-menu" role="menu">
        <div class="dropdown-content">
          <a href="{% url 'index' %}" class="dropdown-item">Home</a>
          <a href="#" class="dropdown-item">My Profile</a>
          <a href="#" class="dropdown-item">Events</a>
          <a href="#" class="dropdown-item">Music</a>
        </div>
      </div>
    </div>
    <div class="navbar-item has-text-centered">
      <span class="title is-4">Orman</span>
    </div>
    <div class="navbar-end">
      <div class="dropdown is-hoverable">
        <div class="dropdown-trigger">
          <button class="button" aria-haspopup="true" aria-controls="dropdown-menu2">
            <span>Admin</span>
          </button>
        </div>
        <div class="dropdown-menu" id="dropdown-menu2" role="menu">
          <div class="dropdown-content">
            <a href="#" class="dropdown-item">People</a>
            <a href="#" class="dropdown-item">Instruments</a>
            <a href="{% url 'admin_instrument_family' %}" class="dropdown-item">Instrument Families</a>
            <a href="#" class="dropdown-item">Events</a>
            <a href="#" class="dropdown-item">Music</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="container is-centered" style="width: 70%;">
  <ul class="messages">
  {% for message in messages %}
  <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
  {% endfor %}
  </ul>
  {% block content %}{% endblock %}
  </div>
</body>
