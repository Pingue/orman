{% extends "base.html" %}
{% block title %}Reset password | Orman{% endblock %}
{% block content %}
<div class="card bg-base-200 border border-base-content/30 max-w-md mx-auto">
  <div class="card-body">
    <h2 class="card-title">Reset your password</h2>
    <p class="text-sm opacity-70">Enter your email address and we'll send you a reset link.</p>
    <form method="post" class="space-y-3 mt-2">
      {% csrf_token %}
      <div class="form-control">
        <label class="label" for="id_email"><span class="label-text">Email</span></label>
        <input type="email" name="email" id="id_email" autofocus required
               class="input input-bordered w-full">
      </div>
      <div class="card-actions justify-between pt-2">
        <a href="{% url 'login' %}" class="btn btn-ghost btn-sm">← Back to sign in</a>
        <button type="submit" class="btn btn-primary">Send reset link</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
