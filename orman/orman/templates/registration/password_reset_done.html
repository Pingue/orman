{% extends "base.html" %}
{% block title %}Check your email | Orman{% endblock %}
{% block content %}
<div class="card bg-base-200 border border-base-content/30 max-w-md mx-auto">
  <div class="card-body text-center space-y-3">
    <i class="fas fa-envelope-open-text text-4xl opacity-60"></i>
    <h2 class="card-title justify-center">Check your email</h2>
    <p class="text-sm opacity-70">
      If that address is registered we've sent a password reset link. It expires in 24 hours.
    </p>
    <p class="text-xs opacity-50">Didn't get it? Check your spam folder, or
      <a href="{% url 'password_reset' %}" class="link">try again</a>.</p>
  </div>
</div>
{% endblock %}
