{% extends "base.html" %}
{% block title %}Password reset | Orman{% endblock %}
{% block content %}
<div class="card bg-base-200 border border-base-content/30 max-w-md mx-auto">
  <div class="card-body text-center space-y-3">
    <i class="fas fa-check-circle text-4xl text-success opacity-80"></i>
    <h2 class="card-title justify-center">Password updated</h2>
    <p class="text-sm opacity-70">Your password has been set. You can now sign in.</p>
    <a href="{% url 'login' %}" class="btn btn-primary btn-sm">Sign in</a>
  </div>
</div>
{% endblock %}
